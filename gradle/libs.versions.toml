# libs.versions.toml
[versions]
# Baseline toolchain
agp = "9.4.1"
kotlin = "2.4.20"
maps-secrets = "2.0.1"


# Jetpack core libs
androidx-core      = "1.17.0"
androidx-appcompat = "1.8.0"
androidx-activity  = "1.12.3"
androidx-lifecycle = "2.10.0"

# Unit test
junit = "4.13.2"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"

# KotlinX
coroutines   = "1.11.0"
serialization = "1.10.0"

# Compose Android (pakai BOM)
compose-bom = "2026.09.00"

# Firebase
firebase-bom    = "34.8.0"
google-services = "4.4.4"

# Koin untuk DI
koin = "4.2.2"

# Material 3 untuk themes.xml
material = "1.14.0"

# navigation
androidx-navigation = "2.9.7"

#datetime
kotlinx-datetime = "0.7.1"

datastore = "1.2.0"

coroutines-play-services = "1.11.0"

# Maps
maps-compose = "8.0.0"
play-services-maps = "20.1.0"
play-services-location = "21.3.0"
runtimeSaveable = "1.10.2"
work = "2.10.5"


[libraries]
# Kotlin test
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
kotlin-test       = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit  = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit             = { module = "junit:junit", version.ref = "junit" }

# AndroidX
androidx-core-ktx       = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat      = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

# Lifecycle Compose
androidx-lifecycle-viewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose   = { module = "androidx.lifecycle:lifecycle-runtime-compose",  version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }

# Compose via BOM
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }

compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-text = { group = "androidx.compose.ui", name = "ui-text" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }


# datetime
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# KotlinX
kotlinx-coroutines    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Firebase (tanpa -ktx — kita pakai BoM)
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
# App Check (Issue #494): versi dikelola Firebase BoM. Provider debug HANYA via debugImplementation.
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines-play-services" }
firebase-common = { module = "com.google.firebase:firebase-common" }

# Koin (Android & Compose)
koin-core                = { module = "io.insert-koin:koin-core",                version.ref = "koin" }
koin-android             = { module = "io.insert-koin:koin-android",             version.ref = "koin" }
koin-compose             = { module = "io.insert-koin:koin-androidx-compose",    version.ref = "koin" }

# Material Design 3
google-material = { module = "com.google.android.material:material", version.ref = "material" }

# navigation
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }

# Maps
maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "maps-compose" }
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "play-services-maps" }
google-location  = { module = "com.google.android.gms:play-services-location", version.ref = "play-services-location" }


# Data Store
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-runtime-saveable = { group = "androidx.compose.runtime", name = "runtime-saveable", version.ref = "runtimeSaveable" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

[plugins]
# Android
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary     = { id = "com.android.library",     version.ref = "agp" }

# Kotlin
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }

# Google Services & Compose compiler plugin (Kotlin 2.x)
googleServices = { id = "com.google.gms.google-services", version.ref = "google-services" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose",    version.ref = "kotlin" }

# Kunci Google Maps dari local.properties (tidak pernah di-commit)
mapsSecrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "maps-secrets" }
